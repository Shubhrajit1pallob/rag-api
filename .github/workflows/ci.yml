name: CI

# Tests and a dependency audit run on every PR, every push to main and every release.
# The image is built and scanned on PRs and pushes to main, but never pushed there.
# It is PUSHED to GHCR only when a stable GitHub Release is published: GHCR visibility
# is per package, not per tag, so releases must be the only images that ever exist.
# There is deliberately no deploy step: the cluster is internal-only and pulls the image itself.
# After a release is published, the bump-homelab job opens a pull request in the Homelab
# repository with the new image tag. It never merges: merging is what ArgoCD acts on.

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

# Default for every job; the publish job below is the only one that raises it.
permissions:
  contents: read

# Cancel superseded PR runs. Never cancel a run on main: it may be mid-publish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # GHCR requires a lowercase image name.
  IMAGE: ghcr.io/shubhrajit1pallob/rag-api

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # No real keys needed: the unit tests use fakes. The Postgres integration
      # tests skip themselves here (no TEST_DATABASE_URL); the integration job runs them.
      - run: pytest -q

  # Runs the Postgres tests against a throwaway pgvector database. The password is a
  # dummy: the container exists only for this job and is not reachable from outside.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        # pgvector/pgvector:pg17, pinned by digest. Update it deliberately (or via Dependabot).
        image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # With this set, the tests fail (not skip) if TEST_DATABASE_URL is ever missing.
      REQUIRE_TEST_DB: "1"
      # search_path includes `extensions`, as the production rag_api role's does.
      TEST_DATABASE_URL: postgresql://postgres:ci-throwaway@localhost:5432/postgres?options=-csearch_path%3Dpublic,extensions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/integration -v

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Known vulnerabilities in the pinned runtime dependencies.
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt

  # Pull requests and pushes to main: build the image so the Dockerfile stays checked,
  # and scan it. Nothing is pushed and no registry login happens.
  build:
    if: github.event_name != 'release'
    needs: [test, audit, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: rag-api:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Fail on CRITICAL/HIGH findings that already have a fix available.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rag-api:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # Stable releases only: check, build, scan, then push. The only job with write access
  # to packages. Pre-releases are skipped, so they never become public images.
  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: [test, audit, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the guard below can see main. Credentials are still dropped.
          fetch-depth: 0
          persist-credentials: false
      # Fail before building anything unless the tag is vX.Y.Z and its commit is on main.
      # Values go through env, never straight into the script.
      - name: Verify release tag and commit
        env:
          TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::The tagged commit is not on main"
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build locally first and scan it, so a vulnerable image is never published.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: rag-api:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rag-api:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      # Only after the scan passes: log in with the built-in token (no PAT) and push.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags: sha-<full 40-character commit sha> (the manifests pin this one), the
      # version from the release tag (v1.2.3 -> 1.2.3), and latest.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest
      # Every layer is a cache hit from the scan build above.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Proposes the deploy: opens a PR in the Homelab repository that sets the new image tag.
  # It never pushes to that repository's main branch and never merges. The token is a
  # GitHub App installation token limited to the Homelab repo and to contents + pull
  # requests; the App's private key is an environment secret of `release`. This job does
  # not use GITHUB_TOKEN, so it gets no permissions at all. If the App is not configured
  # the job fails on purpose: the image is already published, and a red job says the
  # manifest was not bumped.
  bump-homelab:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions: {}
    env:
      HOMELAB_REPO: Shubhrajit1pallob/Homelab
      IMAGE_NAME: ghcr.io/shubhrajit1pallob/rag-api
      MANIFEST: apps/rag-api/kustomization.yaml
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HOMELAB_BUMP_CLIENT_ID }}
          private-key: ${{ secrets.HOMELAB_BUMP_APP_PRIVATE_KEY }}
          owner: Shubhrajit1pallob
          repositories: Homelab
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.HOMELAB_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          path: homelab
          persist-credentials: false
      # Event values reach the script only through env, never by being expanded into it.
      # GH_TOKEN is set on this step alone; `gh auth setup-git` makes git read it from the
      # environment, so the token is never written to .git/config.
      - name: Bump the image tag and open the PR
        working-directory: homelab
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.event.release.tag_name }}
          FULL_SHA: ${{ github.sha }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          short="${FULL_SHA:0:7}"
          new_tag="sha-${FULL_SHA}"
          branch="bump/rag-api-${version}"
          gh auth setup-git

          # Idempotent: a re-run must not open a second PR. A branch with no PR means an
          # earlier run died between the push and the PR, so only the PR is opened then.
          existing="$(gh pr list --repo "$HOMELAB_REPO" --head "$branch" --state all --json number --jq length)"
          if [ "$existing" != "0" ]; then
            echo "::notice::A pull request for $branch already exists, nothing to do."
            exit 0
          fi

          base="$(git rev-parse --abbrev-ref HEAD)"

          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::notice::Branch $branch already exists without a PR, opening the PR only."
          else
            NEW_TAG="$new_tag" yq -i '(.images[] | select(.name == strenv(IMAGE_NAME))).newTag = strenv(NEW_TAG)' "$MANIFEST"

            # The file must now hold exactly the tag publish pushed, and nothing else may
            # have changed. A manifest that changed shape fails here instead of being skipped.
            actual="$(yq '.images[] | select(.name == strenv(IMAGE_NAME)) | .newTag' "$MANIFEST")"
            if [ "$actual" != "$new_tag" ]; then
              echo "::error::$MANIFEST does not contain newTag $new_tag for $IMAGE_NAME after the edit."
              exit 1
            fi
            if git diff --quiet; then
              echo "::notice::$MANIFEST already points at $new_tag, nothing to propose."
              exit 0
            fi
            if [ "$(git diff --numstat | tr '\t' ' ')" != "1 1 $MANIFEST" ]; then
              echo "::error::Expected exactly one changed line in $MANIFEST. The manifest changed shape; update this workflow."
              git --no-pager diff
              exit 1
            fi
            git --no-pager diff

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git add "$MANIFEST"
            git commit -m "rag-api: bump image to ${version} (sha-${short})"
            git push origin "$branch"
          fi

          {
            echo "Proposes deploying rag-api ${version}: [release](${RELEASE_URL})."
            echo
            echo "Image tag: \`${new_tag}\`"
            echo
            echo "This PR changes only \`newTag\` in \`${MANIFEST}\`."
            echo
            echo "Opened automatically by the rag-api repository's CI after the image was published."
          } > "$RUNNER_TEMP/pr-body.md"

          gh pr create \
            --repo "$HOMELAB_REPO" \
            --base "$base" \
            --head "$branch" \
            --title "rag-api: bump image to ${version} (sha-${short})" \
            --body-file "$RUNNER_TEMP/pr-body.md"
